<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>News Blog</title>
</head>
<body>
    <div  class="main-container">
        <div class="back-button">
            <button>
                <img src="" alt="Flecha mirando hacía la izquierda">
            </button>
        </div>
        <div class="login-container">
            <div>
                <h1>Iniciar sesión</h1>
                <img src="" alt="Logo del blog">
            </div>
            <div>
                <p>Correo Electrónico</p>
                <textarea name="emali-input" id="emali-input" placeholder="Ingrese su correo electrónico"></textarea>
                
                <p>Contraseña</p>
                <textarea name="password-input" id="password-input" placeholder="Ingrese su contraseña"></textarea>
                <div class="remember-user-container">
                    <input type="checkbox" name="confirm-box" id="remember-user" value="Yes">
                    <label for="confirm-box"> Recordarme</label>
                </div>
            </div>
        </div>
        <div class="buttons-login">
            <button></button>
            <button></button>
            <p>¿No tienes cuenta?
                <a href="#">
                    <b>Regístrate</b>
                </a>
            </p>
        </div>
    </div>
</body>
</html>
