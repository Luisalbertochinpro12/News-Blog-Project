<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Styles/style-login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>News Blog</title>
</head>
<body>
    <div class="main-container">
        <div class="back-button">
            <button>
                <img src="https://cdn-icons-png.flaticon.com/512/3114/3114883.png" alt="" width="50px" height="50px">
            </button>
        </div>
        <div class="login-container">
            <div class="header-login">
                <h1>Iniciar sesión</h1>
                <img src="../Resource/Logo.jpg" alt="Logo del blog">
            </div>
            <div class="data-container">
                <p>Correo Electrónico</p>
                <input type="text" placeholder="Ingrese su correo eletrónico">
                
                <p>Contraseña</p>
                <input type="password" name="" id="password-input" placeholder="Ingrese su contraseña">
                <div class="remember-user-container">
                    <input type="checkbox" name="confirm-box" id="remember-user" value="Yes">
                    <label for="confirm-box"> Recordarme</label>
                </div>
            </div>
            <div class="login-button">
                <button>Iniciar sesión</button>
                <p>¿No tienes cuenta?</p>
                <a href="../Pages/form.html">
                    <b>Regístrate</b>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
